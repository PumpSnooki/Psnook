<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Psnook | Website for Pumpsnooki</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --border: #222230;
      --accent: #7c3aed;
      --accent-glow: rgba(124, 58, 237, 0.35);
      --kick: #53fc18;
      --kick-glow: rgba(83, 252, 24, 0.3);
      --twitch: #9146ff;
      --twitch-glow: rgba(145, 70, 255, 0.3);
      --youtube: #ff0000;
      --youtube-glow: rgba(255, 0, 0, 0.3);
      --discord: #5865f2;
      --discord-glow: rgba(88, 101, 242, 0.3);
      --twitter: #1d9bf0;
      --twitter-glow: rgba(29, 155, 240, 0.3);
      --text: #e8e8f0;
      --muted: #888899;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* Atmospheric background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 50% 0%, rgba(124,58,237,0.18) 0%, transparent 70%),
        radial-gradient(ellipse 40% 30% at 80% 80%, rgba(83,252,24,0.06) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    main {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 680px;
      padding: 60px 24px 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 48px;
    }

    /* Header */
    header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .avatar-wrap {
      position: relative;
      width: 120px;
      height: 120px;
    }

    .avatar-wrap::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, var(--accent), var(--kick), var(--twitch), var(--accent));
      animation: spin 6s linear infinite;
      z-index: -1;
    }

    .avatar-wrap img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      border: 3px solid var(--bg);
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3rem, 10vw, 5rem);
      letter-spacing: 0.06em;
      background: linear-gradient(135deg, #fff 30%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }

    .tagline {
      font-size: 1rem;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 600;
    }

    /* Section labels */
    .section-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      align-self: flex-start;
      padding-left: 2px;
    }

    /* Platform cards */
    .stream-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .platform-card {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 18px 22px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-decoration: none;
      color: var(--text);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .platform-card::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .platform-card:hover {
      transform: translateY(-2px);
    }

    /* Kick */
    .platform-card.kick { border-color: rgba(83,252,24,0.25); }
    .platform-card.kick::before { background: linear-gradient(135deg, rgba(83,252,24,0.07) 0%, transparent 60%); }
    .platform-card.kick:hover { border-color: var(--kick); box-shadow: 0 4px 24px var(--kick-glow); }
    .platform-card.kick:hover::before { opacity: 1; }
    .platform-card.kick .icon-dot { background: var(--kick); box-shadow: 0 0 10px var(--kick-glow); }

    /* Twitch */
    .platform-card.twitch { border-color: rgba(145,70,255,0.25); }
    .platform-card.twitch::before { background: linear-gradient(135deg, rgba(145,70,255,0.07) 0%, transparent 60%); }
    .platform-card.twitch:hover { border-color: var(--twitch); box-shadow: 0 4px 24px var(--twitch-glow); }
    .platform-card.twitch:hover::before { opacity: 1; }
    .platform-card.twitch .icon-dot { background: var(--twitch); box-shadow: 0 0 10px var(--twitch-glow); }

    /* YouTube */
    .platform-card.youtube { border-color: rgba(255,0,0,0.2); }
    .platform-card.youtube::before { background: linear-gradient(135deg, rgba(255,0,0,0.07) 0%, transparent 60%); }
    .platform-card.youtube:hover { border-color: var(--youtube); box-shadow: 0 4px 24px var(--youtube-glow); }
    .platform-card.youtube:hover::before { opacity: 1; }
    .platform-card.youtube .icon-dot { background: var(--youtube); box-shadow: 0 0 10px var(--youtube-glow); }

    .platform-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: rgba(255,255,255,0.05);
      position: relative;
      z-index: 1;
    }

    .platform-icon svg { width: 24px; height: 24px; }

    .platform-info {
      flex: 1;
      position: relative;
      z-index: 1;
    }

    .platform-name {
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.02em;
    }

    .platform-handle {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .icon-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }

    /* Arrow */
    .arrow {
      color: var(--muted);
      font-size: 1.1rem;
      position: relative;
      z-index: 1;
      transition: transform 0.2s ease, color 0.2s ease;
    }
    .platform-card:hover .arrow { transform: translateX(4px); color: var(--text); }

    /* Social section */
    .social-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .social-row {
      display: flex;
      gap: 12px;
    }

    .social-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      border: 1px solid;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .social-btn svg { width: 20px; height: 20px; flex-shrink: 0; }

    .social-btn.discord {
      background: rgba(88,101,242,0.12);
      border-color: rgba(88,101,242,0.35);
      color: #a5acff;
    }
    .social-btn.discord:hover {
      background: rgba(88,101,242,0.22);
      border-color: var(--discord);
      box-shadow: 0 4px 20px var(--discord-glow);
      transform: translateY(-2px);
      color: #fff;
    }

    .social-btn.twitter {
      background: rgba(29,155,240,0.1);
      border-color: rgba(29,155,240,0.3);
      color: #7dcfff;
    }
    .social-btn.twitter:hover {
      background: rgba(29,155,240,0.2);
      border-color: var(--twitter);
      box-shadow: 0 4px 20px var(--twitter-glow);
      transform: translateY(-2px);
      color: #fff;
    }

    /* Footer */
    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      color: var(--muted);
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      padding-bottom: 32px;
    }

    /* Divider */
    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
    }

    @media (max-width: 420px) {
      .social-row { flex-direction: column; }
    }
  </style>
</head>
